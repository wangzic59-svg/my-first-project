plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.cardpool'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.cardpool'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5-realtime'
    }

    signingConfigs {
        debug {
            storeFile file(System.getenv('CARDPOOL_KEYSTORE') ?: rootProject.file('work/debug.keystore'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// JNI artifacts are always built from the checked-in C++ source.
tasks.register('buildNative', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/build_native.py'
}
tasks.named('preBuild').configure { dependsOn 'buildNative' }
