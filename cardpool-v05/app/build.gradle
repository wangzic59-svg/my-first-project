plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.cardpool'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.cardpool'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.6-capture'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        debug {
            storeFile file(System.getenv('CARDPOOL_KEYSTORE') ?: rootProject.file('work/debug.keystore'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    sourceSets {
        main.java.srcDirs += [rootProject.file('work/ocr/Tesseract4Android-4.9.0/tesseract4android/src/main/java'), rootProject.file('work/ocr-generated')]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// JNI artifacts are always built from the checked-in C++ source.
tasks.register('buildNative', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/build_native.py'
}
tasks.register('prepareOcr', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/prepare_ocr.py'
}
tasks.register('buildOcr', Exec) {
    dependsOn 'prepareOcr'
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/build_ocr_native.py'
}
tasks.named('preBuild').configure { dependsOn 'buildNative', 'buildOcr' }

dependencies {
 implementation 'androidx.annotation:annotation:1.3.0'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
