name: CardPool V0.6 build and screenshot tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cardpool-v05/**'
      - '.github/workflows/cardpool-v05.yml'
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: cardpool-v05
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: |
            cardpool-v05/work/ocr
            cardpool-v05/work/ocr-build
          key: ocr-native-ubuntu24-r27c-tesseract4android490-v1
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' 
      - run: bash scripts/test.sh
      - run: bash scripts/prepare_signing.sh
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable emulator acceleration
        working-directory: .
        run: sudo chmod 666 /dev/kvm
      - name: Real bundled OCR and overlay tests on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            # Gradle uninstalls test APKs on completion; app external files may disappear.
            # Preserve real instrumentation OCR metrics from logcat instead of pulling a deleted file.
            mkdir -p cardpool-v05/reports
            set +e
            (cd cardpool-v05 && ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash gradlew --no-daemon :app:connectedDebugAndroidTest)
            test_status=$?
            set -e
            adb logcat -d -v brief -s OCR_ACCURACY:I '*:S' > cardpool-v05/reports/ocr-logcat.txt || true
            grep -F 'Synthetic numeric exact accuracy=' cardpool-v05/reports/ocr-logcat.txt > cardpool-v05/reports/ocr-accuracy.txt || true
            if [ ! -s cardpool-v05/reports/ocr-accuracy.txt ]; then
              echo "OCR accuracy report missing from instrumentation logcat" >&2
            fi
            test "$test_status" -eq 0
            test -s cardpool-v05/reports/ocr-accuracy.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardpool-v06-build-and-test-results
          path: |
            cardpool-v05/app/build/outputs/apk/debug/app-debug.apk
            cardpool-v05/app/build/outputs/androidTest-results/**
            cardpool-v05/app/build/reports/**
            cardpool-v05/reports/**
      - name: Verify build artifacts without publishing an APK to the repository
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s reports/ocr-accuracy.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > reports/V06_ACTIONS_SHA256SUMS
